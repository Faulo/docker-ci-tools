name: Docker

on:
    push:
        branches:
            - "main"
        paths:
            - "common/**"
            - "linux/**"
            - "windows/**"
            - "tests/**"
            - ".jenkins/**"
            - ".env"
            - ".github/workflows/docker.yml"
            - "Directory.Build.props"
            - "global.json"
    workflow_dispatch:
    schedule:
        - cron: "17 3 1 * *"

permissions:
    contents: read

concurrency:
    group: docker-publish
    cancel-in-progress: false

jobs:
    test-linux:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up .NET
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: 9.0.x
            - name: Run unit tests
              run: dotnet test common/CiTools.Tests/CiTools.Tests.csproj --nologo --configuration Release --blame-hang-timeout 2m

    test-windows:
        runs-on: windows-2022
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up .NET
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
              with:
                  dotnet-version: 9.0.x
            - name: Run unit tests
              run: dotnet test common/CiTools.Tests/CiTools.Tests.csproj --nologo --configuration Release --blame-hang-timeout 2m

    configuration:
        needs:
            - test-linux
            - test-windows
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            image: ${{steps.image.outputs.DOCKER_IMAGE}}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Read image name
              id: image
              shell: bash
              run: grep -m1 '^DOCKER_IMAGE=' .env >> "${GITHUB_OUTPUT}"

    publish:
        needs: configuration
        uses: Faulo/workflows-docker/.github/workflows/publish.yml@v1
        with:
            image: ${{needs.configuration.outputs.image}}
            linux_context: .
            linux_platforms: '{"linux/amd64":"ubuntu-24.04"}'
            windows_context: .
            windows_platforms: '{"windows/amd64":"windows-2022"}'
            windows_variants: >-
                [
                  {"tag":"windows-ltsc2019","build_args":{"OS_BASE":"ltsc2019"}}
                ]
        secrets:
            DOCKERHUB_USERNAME: ${{secrets.DOCKERHUB_USERNAME}}
            DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
